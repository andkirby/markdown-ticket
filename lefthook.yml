min_version: 1.13.0

remotes:
  - git_url: https://github.com/rikby/agent-commit-hooks.git
    # TODO: switch to GitHub URL after pushing v0.2.0
    # ref: v0.2.0
    configs:
      # Secrets & hygiene — every project
      - configs/general/block-env-files.yml
      - configs/general/block-credential-files.yml
      - configs/general/block-home-paths-code.yml
      - configs/general/block-home-paths-commit-msg.yml
      - configs/general/block-generated-files.yml
      - configs/general/block-co-authored-by.yml
      # Ticket hygiene — block unchecked tasks in Implemented tickets
      - configs/mdt/block-mdt-incomplete-tasks.yml
      # Markdown + TypeScript
      - configs/general/check-markdown-fences.yml
      - configs/typescript/run-knip.yml
      - configs/typescript/run-eslint-staged.yml
      # Monorepo — enforces @mdt/shared alias
      - configs/monorepo/block-shared-imports.yml
      # Semantic class enforcement — block utility classes shadowing @layer components
      # See docs/semantic-classes.md in agent-commit-hooks for the full concept.
      - configs/general/enforce-semantic-classes.yml

# NOTE: the parse-css gate lives in lefthook-local.yml (not here).
# A local pre-commit > commands block in lefthook.yml is OVERRIDDEN by the
# remote pre-commit > scripts brought in above (lefthook 2.1.10 does not
# deep-merge local commands into the same key as remote scripts). However,
# a commands block in lefthook-local.yml DOES merge alongside the remote
# scripts. lefthook-local.yml is gitignored, so each clone must recreate it
# — see scripts/parse-css.mjs header comment for the one-line setup.

# Override: remove glob restriction for testing
